# Secure Trio Day gamification API Worker
# Deploy: npx wrangler deploy --config wrangler.gamification.toml
#
# Secrets:
#   FIREBASE_PROJECT_ID
#   FIREBASE_SA_CLIENT_EMAIL
#   FIREBASE_SA_PRIVATE_KEY
#
# The API Worker is the source for authenticated gamification writes.

name = "trio-gamification"
main = "gamification.js"
compatibility_date = "2026-09-18"
workers_dev = true

[observability]
enabled = true
