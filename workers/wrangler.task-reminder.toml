name = "trio-task-reminder"
main = "task-reminder-cron.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 */6 * * *"]

[vars]
FIREBASE_PROJECT_ID = "nkm-ind"

[[kv_namespaces]]
binding = "NOTIFICATION_DEDUP_KV"
id = "notification-dedup-kv"
preview_id = "notification-dedup-kv-preview"