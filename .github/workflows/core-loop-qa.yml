name: Trio Day Core Loop QA

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Syntax check JavaScript
        run: |
          node --input-type=module --check < public/core-loop.js
          node --input-type=module --check < public/webmcp.js
          node --input-type=module --check < public/ui/header.js
          node --input-type=module --check < public/script.js
          node --input-type=module --check < public/challenge.js
          node --input-type=module --check < public/challenge-create.js
          node --input-type=module --check < public/profile.js
          node --input-type=module --check < public/auth.js
          node --input-type=module --check < public/gamification/streaks.js
          node --input-type=module --check < public/gamification/xp-levels.js
          node --input-type=module --check < public/gamification/community-tasks.js
          node --input-type=module --check < public/sound-manager.js
          node --check functions/index.js
          node --check server.js
          node --check workers/gamification.js
      - name: Verify Playwright test discovery
        run: npm test -- --list

  playwright-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npx serve public -l 5500 &
          sleep 5
          curl -f http://127.0.0.1:5500/index.html || exit 1
      - name: Run Playwright QA tests
        run: npx playwright test qa-audit.spec.js --reporter=line
