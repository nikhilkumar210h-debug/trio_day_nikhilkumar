name: Validate Admin Activity

on:
  pull_request:
    branches: [master]
  push:
    branches: [fix/admin-activity-workflow-ux]

permissions:
  contents: read

jobs:
  admin-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Admin Activity workflow and JavaScript syntax
        run: node scripts/validate-admin-activity.mjs
