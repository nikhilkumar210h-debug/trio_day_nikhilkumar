    <style>:root{--primary:#6366f1;--bg:#0a0f1a;--surface:#141b2e;--ink:#f1f5f9;--border:rgba(148,163,184,.12)}*{box-sizing:border-box}html{background:var(--color-bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200}.tricolor-strip span{flex:1}.tricolor-strip span:nth-child(1){background:linear-gradient(90deg,#ff9933,#ff7700)}.tricolor-strip span:nth-child(2){background:#fff}.tricolor-strip span:nth-child(3){background:linear-gradient(90deg,#128807,#0a6305)}.topbar{position:sticky;top:3px;z-index:100;background:var(--color-bg-elevated);border-bottom:1px solid var(--border)}.notifications-main{width:min(680px,100%);margin:auto;padding:20px 16px}.notifications-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--color-bg-elevated);backdrop-filter:blur(18px);border-top:1px solid rgba(148,163,184,.12);z-index:55;padding-bottom:env(safe-area-inset-bottom)}.nav-row{width:min(520px,100%);margin:auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;gap:2px;padding:6px 6px 4px;align-items:end}.nav-btn{padding:6px 2px 4px;border-radius:12px;color:var(--color-ink-dim);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;gap:2px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav-btn.active{color:var(--color-primary-text);background:rgba(99,102,241,.10)}.nav-btn--create{background:linear-gradient(135deg,#4f46e5 0%,#4338ca 100%);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:16px;height:48px;margin-bottom:4px;box-shadow:0 4px 12px rgba(67,56,202,.28);gap:0}.nav-btn--create .nav-icon svg{stroke:#fff}</style>

<body>
    <div class="tricolor-strip"><span></span><span></span><span></span></div>
    <header class="topbar">
        <div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-chakra">☸</span><span
                    class="brand-copy"><strong>trio_day</strong><small>NOTIFICATIONS</small></span></a>
            <div id="authStatus" class="auth-status"></div>
        </div>
    </header>
    <main class="notifications-main">
        <section class="notifications-card">
            <div class="notifications-header">
                <div class="notifications-tabs" role="tablist" aria-label="Notification filters">
                    <button role="tab" class="notification-tab active" data-tab="all" aria-selected="true">All</button>
                    <button role="tab" class="notification-tab" data-tab="unread" aria-selected="false">Unread</button>
                    <button role="tab" class="notification-tab" data-tab="mentions" aria-selected="false">Mentions</button>
                </div>
                <button id="markAllReadBtn" class="btn secondary" type="button" style="font-size:12px; padding:6px 12px;">Mark all read</button>
            </div>
            <div id="notificationsList" class="notifications-list"></div>
            <div id="notificationsEmpty" class="notifications-empty" hidden>Koi notification nahi abhi</div>
        </section>
    </main>
