  <style>:root{--primary:#6366f1;--bg:#0a0f1a;--surface:#141b2e;--ink:#f1f5f9;--border:rgba(148,163,184,.12)}*{box-sizing:border-box}html{background:#0a0f1a}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;background:#0a0f1a}.tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200}.tricolor-strip span{flex:1}.tricolor-strip span:nth-child(1){background:linear-gradient(90deg,#ff9933,#ff7700)}.tricolor-strip span:nth-child(2){background:#fff}.tricolor-strip span:nth-child(3){background:linear-gradient(90deg,#128807,#0a6305)}.tasks-main{width:min(1000px,100%);margin:auto;padding:16px}.nkm-activity{max-width:680px}.nkm-activity-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}.nkm-activity-head h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}.nkm-activity-head p{font-size:12px;color:#94a3b8;margin:2px 0 0}.nkm-today-card{display:flex;align-items:center;gap:14px;background:#141b2e;border:1px solid rgba(148,163,184,.12);border-radius:16px;padding:14px;margin-bottom:14px}.nkm-today-ring{width:56px;flex:none;display:grid;place-items:center}.nkm-today-center{flex:1;min-width:0}.nkm-today-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a5b4fc;font-weight:700}.nkm-today-sub{font-size:13px;color:#cbd5e1;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nkm-today-meta{font-size:11px;color:#94a3b8;display:flex;gap:6px;flex-wrap:wrap}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,15,26,.96);backdrop-filter:blur(18px);border-top:1px solid rgba(148,163,184,.12);z-index:55;padding-bottom:env(safe-area-inset-bottom)}.nav-row{width:min(520px,100%);margin:auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;gap:2px;padding:6px 6px 4px;align-items:end}.nav-btn{padding:6px 2px 4px;border-radius:12px;color:#64748b;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;gap:2px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav-btn.active{color:#a5b4fc;background:rgba(99,102,241,.10)}.nav-btn--create{background:linear-gradient(135deg,#4f46e5 0%,#4338ca 100%);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:16px;height:48px;margin-bottom:4px;box-shadow:0 4px 12px rgba(67,56,202,.28);gap:0}.nav-btn--create .nav-icon svg{stroke:#fff}</style>

<body class="app-page">
  <div class="tricolor-strip"><span></span><span></span><span></span></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>TASKS</small></span></a>
      <div class="topbar-actions">
        <div id="authStatus" class="auth-status"></div>
      </div>
    </div>
  </header>

  <main class="tasks-main nkm-activity">
    <div class="nkm-activity-head">
      <div class="nkm-activity-head-title">
        <h1>Today's Activity</h1>
        <p>Focus today • track progress • earn XP</p>
      </div>
      <div class="nkm-activity-head-actions">
        <a href="task-create.html" class="nkm-btn nkm-btn--primary nkm-btn--sm nkm-activity-create">+ Create</a>
        <div class="nkm-activity-secondary" id="activitySecondary">
          <a href="leaderboard.html" class="nkm-btn nkm-btn--sm">Leaderboard</a>
          <a href="admin-tasks.html" id="adminLink" class="nkm-btn nkm-btn--sm" hidden>Admin</a>
        </div>
        <button type="button" class="nkm-btn nkm-btn--sm nkm-activity-more" id="activityMoreBtn" aria-haspopup="true" aria-expanded="false" aria-label="More actions">⋯</button>
      </div>
    </div>

    <section class="nkm-today-card" id="todayCard" aria-label="Today's progress">
      <div id="heroRing" class="nkm-today-ring"></div>
      <div class="nkm-today-center">
        <span class="nkm-today-label">Today</span>
        <p id="heroSub" class="nkm-today-sub">Keep the streak alive.</p>
        <div class="nkm-today-meta"><span><strong id="statXp">0</strong> XP</span><span>•</span><span>🔥 <strong id="statStreak">0</strong> days</span><span>•</span><span>Lv <strong id="statLevel">1</strong></span></div>
      </div>
      <div class="nkm-today-xp">
        <div class="nkm-today-xp-label">XP</div>
        <div id="xpLabel" class="nkm-today-xp-val">0 / 100</div>
        <div class="xp-bar nkm-xp-bar"><i id="xpFill" style="width:0%"></i></div>
      </div>
    </section>

    <div class="nkm-activity-layout">
      <div class="nkm-activity-main">
        <div class="nkm-activity-nav">
          <div class="nkm-tabs" role="tablist">
            <button type="button" class="nkm-tab is-active" data-tab="daily">Today</button>
            <button type="button" class="nkm-tab" data-tab="weekly">Weekly</button>
            <button type="button" class="nkm-tab" data-tab="community">Community</button>
            <button type="button" class="nkm-tab" data-tab="challenge">Challenges</button>
          </div>
          <div class="nkm-more-wrap">
            <button type="button" class="nkm-btn nkm-btn--sm" id="moreBtn" aria-haspopup="true" aria-expanded="false">More ▾</button>
            <div id="moreMenu" class="nkm-more-menu" hidden>
              <button type="button" class="nkm-more-item" data-tab="monthly">Monthly</button>
              <button type="button" class="nkm-more-item" data-tab="fun">Fun</button>
            </div>
          </div>
        </div>

        <div id="tasksStatus" class="status" aria-live="polite"></div>
        <div id="taskList" class="task-list"></div>
        <div id="communityBox" hidden>
          <div id="communityStatus" class="status"></div>
          <div id="communityList" class="task-list"></div>
        </div>
      </div>
      <aside class="nkm-activity-rail" id="activityRail" aria-label="Progress">
        <div class="nkm-rail-card">
          <h3>Level <span id="railLevel">1</span></h3>
          <div class="xp-bar"><i id="railXpFill" style="width:0%"></i></div>
          <p id="railXpLabel" style="font-size:11px;color:#94a3b8;margin:4px 0 0">0 / 100 XP</p>
        </div>
        <div class="nkm-rail-card">
          <h3>🔥 Streak</h3>
          <p><strong id="railStreak">0</strong> days <small id="railStreakSub" style="color:#94a3b8">keep going</small></p>
        </div>
        <div class="nkm-rail-card" id="railBadges" hidden>
          <h3>Badges</h3>
          <div id="railBadgesList"></div>
        </div>
        <div class="nkm-rail-card" id="railChallenge" hidden>
          <h3>Active Challenge</h3>
          <p id="railChallengeText" style="font-size:12px;color:#94a3b8"></p>
        </div>
      </aside>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">

      <a class="nav-btn" href="index.html" data-nav="home" aria-label="Home"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></a>

      <a class="nav-btn nav-btn--create" href="#" data-nav="create" aria-label="Create"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></span><span></span></a>
      <a class="nav-btn active" href="tasks.html" data-nav="activity" aria-label="Activity"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg></span><span>Activity</span></a>
      <a class="nav-btn" href="profile.html" data-nav="you" aria-label="You"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 19a8 8 0 0 1 16 0"/></svg></span><span>You</span></a>
    </div>
  </nav>
