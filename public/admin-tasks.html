  <style>:root{--primary:#6366f1;--bg:#0a0f1a;--surface:#141b2e;--ink:#f1f5f9;--border:rgba(148,163,184,.12)}*{box-sizing:border-box}html{background:var(--color-bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200}.tasks-main{width:min(1000px,100%);margin:auto;padding:20px 16px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--color-bg-elevated);backdrop-filter:blur(18px);border-top:1px solid rgba(148,163,184,.12);z-index:55;padding-bottom:env(safe-area-inset-bottom)}.nav-row{width:min(520px,100%);margin:auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;gap:2px;padding:6px 6px 4px;align-items:end}.nav-btn{padding:6px 2px 4px;border-radius:12px;color:var(--color-ink-dim);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;gap:2px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav-btn.active{color:var(--color-primary-text);background:rgba(99,102,241,.10)}.nav-btn--create{background:linear-gradient(135deg,#4f46e5 0%,#4338ca 100%);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:16px;height:48px;margin-bottom:4px;box-shadow:0 4px 12px rgba(67,56,202,.28);gap:0}.nav-btn--create .nav-icon svg{stroke:#fff}</style>

<body class="app-page">
  <div class="tricolor-strip"><span></span><span></span><span></span></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="challenge.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>CHALLENGE ADMIN</small></span></a>
      <div id="authStatus" class="auth-status"></div>
    </div>
  </header>
  <main class="tasks-main">
    <div id="denied" class="empty-state" hidden>
      <h3>Admin only</h3>
      <p>Add your UID to Firestore <code>config/admins</code> → <code>uids</code> array.</p>
      <a class="btn secondary" href="challenge.html">Back</a>
    </div>
    <div id="adminPanel" hidden>
      <span class="eyebrow">Moderation only</span>
      <h1>Challenge admin</h1>
      <p class="muted">Users create challenges themselves. Here you feature, hide, archive, or remove.</p>
      <div class="tasks-toolbar">
        
        <button type="button" class="btn secondary" id="expireBtn">Expire old Challenges</button>
        <button type="button" class="btn secondary" id="badgesBtn">Seed Challenge badges</button>
      </div>
      <p id="adminStatus" class="status"></p>

      <h3 style="margin-top:1.5rem">All user Challenges (including hidden)</h3>
      <div id="adminTasks" class="task-list"></div>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="Primary navigation">
