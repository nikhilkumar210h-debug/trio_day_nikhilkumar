<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081018">
  <title>Notifications — Trio Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>:root{--primary:#6366f1;--bg:#0a0f1a;--surface:#141b2e;--ink:#f1f5f9;--border:rgba(148,163,184,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200}.notification-main{width:min(760px,100%);margin:auto;padding:20px}</style>
  <link rel="preload" href="styles/tokens.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/tokens.css"></noscript>
  <link rel="preload" href="styles/skeleton.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/skeleton.css"></noscript>
  <link rel="preload" href="styles/sheet.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/sheet.css"></noscript>
  <link rel="preload" href="styles/nav.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/nav.css"></noscript>
  <link rel="preload" href="styles/header.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/header.css"></noscript>
  <link rel="preload" href="styles/components.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/components.css"></noscript>
    <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body class="notification-page-body">
  <div class="tricolor-strip" aria-hidden="true"><span></span><span></span><span></span></div>
  <main id="main-content" class="notification-main">
  <div class="notification-overlay active" id="notificationOverlay">
    <div class="notification-modal" role="dialog" aria-modal="true" aria-labelledby="notificationTitle">
      <div class="notification-modal-head">
        <div>
          <span class="eyebrow">Alerts</span>
          <h2 id="notificationTitle">Notifications</h2>
        </div>
        <button class="icon-btn notification-close" type="button" aria-label="Close notifications">×</button>
      </div>
      <div id="notificationList" class="notification-list"></div>
    </div>
  </div>
  </main>

  <script type="module" src="notification.js"></script>
  <script type="module" src="ui/header.js"></script>
  <script type="module" src="ui/nav.js"></script>
  <script type="module" src="ui/sheet.js"></script>
</body>
</html>
