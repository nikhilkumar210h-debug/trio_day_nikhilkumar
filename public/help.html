  <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Trio Day?","acceptedAnswer":{"@type":"Answer","text":"Trio Day is a text-first gamified challenge community. You pick a side on a daily question, see how the community split, and join the discussion with people who think differently."}},{"@type":"Question","name":"Do I need to be right?","acceptedAnswer":{"@type":"Answer","text":"No. Challenges are social prompts, not exams. There's no correct answer — the fun is in the choice, the split, and what people say next."}},{"@type":"Question","name":"Can I change my answer?","acceptedAnswer":{"@type":"Answer","text":"Yes. Your saved choice can be changed and the community result updates in real time."}},{"@type":"Question","name":"Where do comments go?","acceptedAnswer":{"@type":"Answer","text":"Challenge discussion is visible to signed-in users; Private Chat stays one-to-one."}},{"@type":"Question","name":"How do I create a challenge?","acceptedAnswer":{"@type":"Answer","text":"Open Create, choose a format (Quick Pick, Would You, Hot Take, Scenario), add a twist if you want, preview it, and publish."}},{"@type":"Question","name":"How do streaks work?","acceptedAnswer":{"@type":"Answer","text":"Answer at least one challenge each day before midnight. Your streak grows daily. Miss a day and it resets."}},{"@type":"Question","name":"What are XP and levels?","acceptedAnswer":{"@type":"Answer","text":"Every challenge answer gives +25 XP. Every 100 XP = 1 level. Levels unlock badges and leaderboard position."}},{"@type":"Question","name":"Is my data private?","acceptedAnswer":{"@type":"Answer","text":"Your answers are public by default so others can compare. You can set stories to Friends Only. See Privacy Policy for details."}}]}</script>
