<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070913">
  <script>!function(){try{var k='trio-theme',t=localStorage.getItem(k);if(t!=='light'&&t!=='dark'){t=localStorage.getItem('trio_theme');t=(t==='light'||t==='dark')?t:null;}if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#F8F7FF':'#070913');}catch(e){}}</script>
  <title>Leaderboard — Trio Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles/tokens.css?v=20261018">
  <link rel="stylesheet" href="styles/skeleton.css?v=20261018">
  <link rel="stylesheet" href="styles/sheet.css?v=20261018">
  <link rel="stylesheet" href="styles/nav.css?v=20261018">
  <link rel="stylesheet" href="styles/header.css?v=20261018">
  <link rel="stylesheet" href="styles/components.css?v=20261018">
  <link rel="stylesheet" href="style.css?v=20261018-activity">
  <link rel="stylesheet" href="styles/polish.css?v=7">
  <link rel="stylesheet" href="styles/activity-player.css?v=1">
</head>

<body class="app-page activity-player-page">
  <div class="tricolor-strip"><span></span><span></span><span></span></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-chakra"><img src="icons/trio-day-logo.svg" alt="Trio Day" style="width:36px;height:36px;display:block;border-radius:10px;box-shadow:0 4px 18px rgba(99,102,241,.28)"></span><span class="brand-copy"><strong>trio_day</strong></span></a>
      <div id="authStatus" class="auth-status"></div>
    </div>
  </header>

  <main class="activity-wrapper">
    <!-- Header -->
    <div style="text-align:center; margin-bottom: 35px; padding: 0 16px;">
      <h1 style="font-size: clamp(28px, 8vw, 38px); font-weight: 900; line-height: 1.2;">🏆 Weekly <span style="color: #00FFCC;">XP Champions</span></h1>
      <p style="color: #94A3B8; font-size: clamp(14px, 3.5vw, 16px); margin-top: 8px;">Resets every Sunday midnight · Top hustlers climb the podium!</p>
    </div>

    <!-- Podium (Top 3) -->
    <div class="podium-grid" id="podium" hidden>
      <!-- 2nd Place (Left) -->
      <div class="podium-card" id="podium2">
        <div style="font-size: 36px;">🥈</div>
        <h3 style="margin: 8px 0 4px 0;" id="p2Name">—</h3>
        <span class="tag-pill" id="p2Category">—</span>
        <div style="margin-top: 12px;"><span class="xp-badge" id="p2Xp">⚡ 0 XP</span></div>
      </div>

      <!-- 1st Place (Center - Higher) -->
      <div class="podium-card podium-1" id="podium1">
        <div style="font-size: 46px;">👑</div>
        <h2 style="margin: 8px 0 4px 0; color: #FBBF24;" id="p1Name">—</h2>
        <span class="tag-pill" id="p1Category">—</span>
        <div style="margin-top: 14px;"><span class="xp-badge" id="p1Xp">⚡ 0 XP</span></div>
      </div>

      <!-- 3rd Place (Right) -->
      <div class="podium-card" id="podium3">
        <div style="font-size: 36px;">🥉</div>
        <h3 style="margin: 8px 0 4px 0;" id="p3Name">—</h3>
        <span class="tag-pill" id="p3Category">—</span>
        <div style="margin-top: 12px;"><span class="xp-badge" id="p3Xp">⚡ 0 XP</span></div>
      </div>
    </div>

    <!-- Full Ranking List -->
    <h2 style="font-size: clamp(18px, 4.5vw, 22px); font-weight: 800; margin: 40px 0 20px; padding: 0 16px;">📊 Full Ranking</h2>
    <div id="rankingList" class="ranking-list"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" hidden style="text-align:center; padding:40px 20px;">
      <div style="font-size:48px; margin-bottom:16px;">🏆</div>
      <h3 style="margin:0 0 8px;">No rankings yet</h3>
      <p style="color:#94A3B8; margin:0 0 24px;">Complete activities to earn XP and appear on the leaderboard!</p>
      <a href="index.html" class="btn primary">Start an Activity →</a>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <div class="nav-row"></div>
  </nav>

  <script src="auth-preload.js?v=20261018"></script>
  <script type="module" src="auth-guard.js?v=20261018"></script>
  <script type="module" src="auth-ui.js?v=20261018"></script>
  <script type="module" src="theme.js?v=20261018"></script>
  <script type="module" src="ui/header.js?v=20261018"></script>
  <script type="module" src="ui/nav.js?v=20261018"></script>
  <script type="module" src="ui/sheet.js?v=20261018"></script>
  <script type="module" src="ui/sound.js?v=20261018"></script>
  <script type="module" src="leaderboard.js?v=20261018"></script>
</body>
</html>
