<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporary Chat · Trio Day</title><link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/nav.css"><link rel="stylesheet" href="styles/header.css"><link rel="stylesheet" href="style.css"><style>
.temp-chat-page{width:min(720px,100%);margin:auto;padding:18px 12px 90px}
.temp-chat-card{padding:14px;border:1px solid var(--color-border);border-radius:18px;background:var(--color-surface);box-shadow:0 12px 35px rgba(0,0,0,.08)}
.temp-chat-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.temp-kicker{font-size:7px;letter-spacing:.15em;color:var(--color-primary-text);font-weight:900}
.temp-chat-head h1{font-size:18px;margin:4px 0}
.temp-chat-head p{font-size:9px;color:var(--color-ink-muted);line-height:1.45;margin:0}
.temp-timer{font-weight:900;font-size:12px;color:var(--color-primary-text);white-space:nowrap;padding:6px 8px;border:1px solid var(--color-border);border-radius:9px}
.temp-messages{display:grid;gap:6px;max-height:58vh;overflow:auto;margin:12px 0;padding:2px}
.temp-message{max-width:82%;padding:8px 10px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-glass)}
.temp-message.mine{margin-left:auto;background:var(--color-primary-soft)}
.temp-message strong{font-size:8px}.temp-message p{font-size:9px;margin:3px 0 0;line-height:1.45}
.temp-empty{text-align:center;padding:22px;color:var(--color-ink-muted);font-size:9px}
.temp-compose{display:flex;gap:6px}.temp-compose input{flex:1;min-width:0;border:1px solid var(--color-border);background:var(--color-glass);color:var(--color-ink);border-radius:10px;padding:9px;font:inherit;font-size:9px}
.temp-compose button{padding:9px 12px;font-size:9px;border-radius:10px}
.temp-back{display:inline-block;margin-top:10px;color:var(--color-primary-text);font-size:9px;text-decoration:none}
@media(max-width:640px){.temp-chat-page{padding:12px 10px 84px}.temp-chat-card{padding:12px;border-radius:16px}.temp-chat-head h1{font-size:17px}.temp-message{max-width:88%}}
</style></head><body class="app-page"><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>10-MINUTE CHAT</small></span></a><div id="authStatus" class="auth-status"></div></div></header><main class="temp-chat-page"><section class="temp-chat-card"><div class="temp-chat-head"><div><span class="temp-kicker">TEMPORARY</span><h1>Different side, same moment.</h1><p>This chat expires after 10 minutes. Keep it respectful and talk about the Challenge.</p></div><span id="timer" class="temp-timer">10:00</span></div><div id="messages" class="temp-messages"><div class="temp-empty">Starting the temporary room…</div></div><div class="temp-compose"><input id="input" maxlength="280" placeholder="Say why you see it differently…"><button id="send" class="nkm-btn nkm-btn--primary" type="button">Send</button></div><a href="challenge.html" class="temp-back">← Back to Challenge</a></section></main><script type="module" src="auth-guard.js"></script><script type="module" src="auth-ui.js"></script><script type="module" src="theme.js"></script><script type="module" src="temp-chat.js"></script></body></html>
