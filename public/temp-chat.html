<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporary Chat · Trio Day</title><link rel="stylesheet" href="styles/tokens.css?v=20261018"><link rel="stylesheet" href="styles/nav.css?v=20261018"><link rel="stylesheet" href="styles/header.css?v=20261018"><link rel="stylesheet" href="style.css?v=20261018"><style>
.temp-chat-page{width:min(720px,100%);margin:auto;padding:18px 12px 90px}
.temp-chat-card{padding:14px;border:1px solid var(--color-border);border-radius:18px;background:var(--color-surface);box-shadow:0 12px 35px rgba(0,0,0,.08)}
.temp-chat-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.temp-kicker{font-size:7px;letter-spacing:.15em;color:var(--color-primary-text);font-weight:900}
.temp-chat-head h1{font-size:18px;margin:4px 0}
.temp-chat-head p{font-size:9px;color:var(--color-ink-muted);line-height:1.45;margin:0}
.temp-timer{font-weight:900;font-size:12px;color:var(--color-primary-text);white-space:nowrap;padding:6px 8px;border:1px solid var(--color-border);border-radius:9px}
.streak-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.streak-bar-fill{height:100%;border-radius:2px;background:var(--color-primary);width:100%;transition:width .5s ease,background .3s ease}
.streak-bar-fill.warn{background:#f59e0b}
.streak-bar-fill.crit{background:#ef4444}
.keep-streak-btn{width:100%;padding:10px;border-radius:12px;border:1px solid var(--color-border);background:color-mix(in srgb, var(--color-primary) 15%, transparent);color:var(--color-primary-text);font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.keep-streak-btn:hover{border-color:var(--color-primary);background:color-mix(in srgb, var(--color-primary) 25%, transparent)}
.keep-streak-btn.saved{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.35);color:#10b981}
.keep-streak-btn.saved:hover{background:rgba(16,185,129,.25)}
.temp-messages{display:grid;gap:6px;max-height:58vh;overflow:auto;margin:12px 0;padding:2px}
.temp-message{max-width:82%;padding:8px 10px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-glass)}
.temp-message.mine{margin-left:auto;background:var(--color-primary-soft)}
.temp-message strong{font-size:8px}.temp-message p{font-size:9px;margin:3px 0 0;line-height:1.45}
.temp-empty{text-align:center;padding:22px;color:var(--color-ink-muted);font-size:9px}
.temp-compose{display:flex;gap:6px}.temp-compose input{flex:1;min-width:0;border:1px solid var(--color-border);background:var(--color-glass);color:var(--color-ink);border-radius:10px;padding:9px;font:inherit;font-size:9px}
.temp-compose button{padding:9px 12px;font-size:9px;border-radius:10px}
.temp-back{display:inline-block;margin-top:10px;color:var(--color-primary-text);font-size:9px;text-decoration:none}
@media(max-width:640px){.temp-chat-page{padding:12px 10px 84px}.temp-chat-card{padding:12px;border-radius:16px}.temp-chat-head h1{font-size:17px}.temp-message{max-width:88%}}
</style></head><body class="app-page"><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>10-MINUTE CHAT</small></span></a><div id="authStatus" class="auth-status"></div></div></header><main class="temp-chat-page"><section class="temp-chat-card"><div class="temp-chat-head"><div><span class="temp-kicker">TEMPORARY</span><h1>Different side, same moment.</h1><p>This chat expires after 10 minutes. Keep it respectful and talk about the Challenge.</p></div><div style="display:flex;align-items:center;gap:8px"><button id="selectMessagesBtn" class="icon-link" aria-label="Select messages" title="Select messages" style="width:32px;height:32px;border-radius:8px;background:var(--color-glass);border:1px solid var(--color-border);display:grid;place-items:center">☑</button><span id="timer" class="temp-timer">10:00</span></div><div class="streak-bar"><div id="streakFill" class="streak-bar-fill"></div></div><button id="keepStreakBtn" class="keep-streak-btn" type="button">🔥 Keep Trio Streak</button></div><div id="messages" class="temp-messages"><div class="temp-empty">Starting the temporary room…</div></div><div class="temp-compose"><input id="input" maxlength="280" placeholder="Say why you see it differently…"><button id="send" class="nkm-btn nkm-btn--primary" type="button">Send</button></div><a href="index.html" class="temp-back">← Back to Activities</a></section></main><script type="module" src="auth-guard.js?v=20261018"></script><script type="module" src="auth-ui.js?v=20261018"></script><script type="module" src="theme.js?v=20261018"></script><script type="module" src="temp-chat.js?v=20261018"></script></body></html>
