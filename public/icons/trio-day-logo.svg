<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Trio Day</title>
  <desc id="desc">Three connected points forming a triangle around a shared moment.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11182b"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="node" x1="116" y1="102" x2="399" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop stop-color="#fff"/>
      <stop offset=".25" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#6366f1"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#818cf8" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="#22d3ee" stroke-opacity=".07" stroke-width="2"/>
  <path d="M136 142 L376 142 L256 370 Z" fill="none" stroke="url(#node)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M136 142 L376 142 L256 370 Z" fill="url(#node)" opacity=".035"/>
  <g filter="url(#glow)">
    <circle cx="136" cy="142" r="34" fill="#0b1020" stroke="url(#node)" stroke-width="12"/>
    <circle cx="376" cy="142" r="34" fill="#0b1020" stroke="url(#node)" stroke-width="12"/>
    <circle cx="256" cy="370" r="34" fill="#0b1020" stroke="url(#node)" stroke-width="12"/>
    <circle cx="256" cy="256" r="30" fill="url(#core)"/>
  </g>
  <path d="M246 244 L266 244 L259 256 L272 256 L244 280 L251 263 L239 263 Z" fill="#fff" opacity=".96"/>
</svg>