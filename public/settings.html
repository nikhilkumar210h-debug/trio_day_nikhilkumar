<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>Settings — Trio Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/nav.css">
<link rel="stylesheet" href="styles/header.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="styles/polish.css?v=6">
</head>
<body class="app-page">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>SETTINGS</small></span></a>
    <div id="authStatus" class="auth-status"></div>
  </div>
</header>
<main class="app-main" style="max-width:760px;padding-bottom:110px">
  <section class="creator-panel">
    <div class="creator-step-heading">
      <div class="creator-step-badge">⚙</div>
      <div><h2>Settings</h2><p>Manage the parts of Trio Day that are available here.</p></div>
    </div>
    <div style="display:grid;gap:10px;margin-top:16px">
      <a class="nkm-btn" href="profile.html">👤 Profile & account</a>
      <a class="nkm-btn" href="notifications.html">🔔 Notifications</a>
      <div style="padding:12px;border:1px solid var(--color-border);border-radius:14px;background:var(--color-glass)">
        <strong style="display:block;font-size:12px;margin-bottom:8px">Appearance</strong>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="nkm-btn" data-theme-choice="dark">🌙 Dark</button>
          <button type="button" class="nkm-btn" data-theme-choice="light">☀️ Light</button>
          <button type="button" class="nkm-btn" data-theme-choice="system">◐ System</button>
        </div>
      </div>
    </div>
  </section>
</main>
<nav class="bottom-nav" aria-label="Primary navigation"><div class="nav-row"></div></nav>
<script type="module" src="auth-guard.js"></script>
<script type="module" src="auth-ui.js"></script>
<script type="module" src="theme.js"></script>
<script type="module" src="ui/header.js"></script>
<script type="module" src="ui/nav.js?v=20260922-nav7"></script>
<script type="module">
document.querySelectorAll('[data-theme-choice]').forEach(btn => btn.addEventListener('click', () => {
  const value = btn.dataset.themeChoice;
  try {
    if (value === 'system') {
      localStorage.removeItem('trio-theme');
      window.TrioTheme?.initTheme();
    } else {
      window.TrioTheme?.applyTheme(value);
    }
  } catch {}
}));
</script>
</body>
</html>
