  <style>
.challenge-submit-box,.challenge-review-box{display:grid;gap:10px;width:min(100%,720px);padding:16px;border:1px solid var(--color-border);border-radius:18px;background:var(--color-surface)}
.challenge-submit-box strong,.challenge-review-box>strong{font-size:15px}
.challenge-submit-box input,.challenge-submit-box textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--color-border);background:var(--color-bg);color:inherit}
.challenge-complete-note{padding:12px 14px;border:1px solid rgba(34,197,94,.28);border-radius:14px;background:rgba(34,197,94,.08);font-weight:700}
.proof-review-item{display:grid;gap:10px;padding:12px;border:1px solid var(--color-border);border-radius:14px}
.proof-review-item p{margin:6px 0 0;white-space:pre-wrap;color:var(--color-ink-muted)}
.proof-review-actions{display:flex;gap:8px;flex-wrap:wrap}

.case-board{display:grid;gap:14px;margin-top:18px}
.case-panel,.case-briefing{
  display:grid;gap:12px;padding:16px;border:1px solid var(--color-border);
  border-radius:18px;background:var(--color-surface)
}
.case-kicker{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-primary);font-weight:800}
.case-panel h3,.case-briefing h2{margin:0;font-size:18px}
.case-briefing p,.case-briefing-text{margin:0;color:var(--color-ink-muted);line-height:1.65}
.case-note{padding:11px 12px;border-radius:12px;background:rgba(99,102,241,.08);color:var(--color-ink-muted);font-size:12px}
.case-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.case-panel-head>span{font-size:11px;color:var(--color-ink-muted)}
.case-suspect-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.case-suspect{padding:13px;border:1px solid var(--color-border);border-radius:14px;background:rgba(255,255,255,.018)}
.case-suspect-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.case-suspect-head strong{font-size:14px}.case-suspect-head span{font-size:10px;color:var(--color-ink-muted)}
.case-suspect p{margin:8px 0;color:var(--color-ink-muted);font-size:12px;line-height:1.55}
.case-alibi{display:grid;gap:3px;padding-top:8px;border-top:1px solid var(--color-border);font-size:11px;color:var(--color-ink-muted)}
.case-alibi b{color:var(--color-ink)}
.case-clue-list{display:grid;gap:8px}
.case-clue{border:1px solid var(--color-border);border-radius:13px;overflow:hidden;background:rgba(255,255,255,.018)}
.case-clue-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:transparent;color:inherit;padding:12px;text-align:left;cursor:pointer}
.case-clue-toggle>span{display:flex;align-items:center;gap:9px;min-width:0}
.case-clue-toggle b{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(99,102,241,.12);color:var(--color-primary);font-size:11px;flex:none}
.case-clue-toggle strong{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.case-clue-toggle small{font-size:10px;color:var(--color-ink-muted);text-transform:uppercase;letter-spacing:.06em}
.case-clue-content{padding:0 12px 13px 45px;color:var(--color-ink-muted);font-size:12px;line-height:1.6}
.case-clue-content p{margin:7px 0}.case-clue-content a{color:var(--color-primary)}
.case-clue-type{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-ink-dim)}
.case-timeline{display:grid;gap:0}
.case-timeline-row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border);font-size:12px;line-height:1.5}
.case-timeline-row:last-child{border-bottom:0}.case-time{font-weight:800;color:var(--color-primary)}
.case-hints .case-panel-head h3{margin-top:2px}
.case-hint-actions{display:flex;gap:8px;flex-wrap:wrap}
.case-hint-btn{font-size:11px}
.case-hint-output{min-height:42px;padding:11px 12px;border-radius:12px;background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.14);color:var(--color-ink-muted);font-size:12px;line-height:1.55}
.case-final{scroll-margin-top:80px}
.case-evidence-select{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.case-evidence-select label{display:flex;align-items:flex-start;gap:8px;padding:10px;border:1px solid var(--color-border);border-radius:11px;font-size:11px;color:var(--color-ink-muted);cursor:pointer}
.case-evidence-select label:has(input:checked){border-color:var(--color-primary);background:rgba(99,102,241,.08);color:var(--color-ink)}
.case-evidence-select input{accent-color:var(--color-primary);margin-top:2px}
.case-finished{border-color:rgba(34,197,94,.28);background:rgba(34,197,94,.07)}
@media(max-width:620px){.case-suspect-grid,.case-evidence-select{grid-template-columns:1fr}.case-clue-content{padding-left:12px}}
</style>
<style>:root{--primary:#6366f1;--bg:#0a0f1a;--surface:#141b2e;--ink:#f1f5f9;--border:rgba(148,163,184,.12)}*{box-sizing:border-box}html{background:var(--color-bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200}.tasks-main{width:min(1000px,100%);margin:auto;padding:20px 16px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--color-bg-elevated);backdrop-filter:blur(18px);border-top:1px solid rgba(148,163,184,.12);z-index:55;padding-bottom:env(safe-area-inset-bottom)}.nav-row{width:min(520px,100%);margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:6px 6px 4px;align-items:end}.nav-btn{padding:6px 2px 4px;border-radius:12px;color:var(--color-ink-dim);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;gap:2px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}.nav-btn.active{color:var(--color-primary-text);background:rgba(99,102,241,.10)}.nav-btn--create{background:linear-gradient(135deg,#4f46e5 0%,#4338ca 100%);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:16px;height:48px;margin-bottom:4px;box-shadow:0 4px 12px rgba(67,56,202,.28);gap:0}.nav-btn--create .nav-icon svg{stroke:#fff}</style>
