<body class="private-chat-page">
<div class="tricolor-strip"><span></span><span></span><span></span></div>
<header class="topbar private-topbar">
  <div class="topbar-inner">
    <a class="back-chat" href="chat.html" aria-label="Back to chats">‹</a>
    <a id="peerProfile" class="peer-top" href="#" aria-label="Open profile">
      <span id="peerAvatar" class="peer-avatar">U</span>
      <span class="peer-copy"><strong id="peerName">Loading...</strong><small id="peerId">TRIO-</small></span>
    </a>
    <div class="private-top-actions"><a id="peerProfileIcon" class="icon-link" href="#" aria-label="Profile">◉</a><a class="icon-link" href="chat.html" aria-label="Back to chats">☰</a></div>
  </div>
</header>

<main class="private-main">
  <section class="private-chat-card">
    <div id="privateMessages" class="private-messages"><div class="td-skeleton td-skeleton--wide" aria-label="Loading messages"></div></div> aria-live="polite"></div>
    <form id="privateForm" class="chat-input-row">
      <input id="privateInput" maxlength="500" autocomplete="off" placeholder="Message…">
      <button class="btn primary" type="submit">Send</button>
    </form>
  </section>
</main>
