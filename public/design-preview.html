    // Theme toggle button for You screen (placed in settings)

    // Handle navigation
    function showScreen(screenId) {
      // Hide all screens
      document.querySelectorAll('[id^="screen-"]').forEach(el => el.classList.add('hidden'));
      
      // Show selected screen
      const screenEl = document.getElementById(`screen-${screenId}`);
      if (screenEl) {
        screenEl.classList.remove('hidden');
      }
      
      // Update active nav button
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-nav') === screenId);
      });
      
      // Update URL hash
      window.location.hash = screenId;
    }
    
    // Initialize
    function initPreview() {
      // Create screen containers
      Object.keys(screens).forEach(screenId => {
        const screenDiv = document.createElement('div');
        screenDiv.id = `screen-${screenId}`;
        screenDiv.className = 'preview-screen';
        screenDiv.innerHTML = screens[screenId];
        if (screenId !== 'today') { // Hide all except today by default
          screenDiv.classList.add('hidden');
        }
        document.getElementById('previewContent').appendChild(screenDiv);
      });
      
      // Handle hash changes
      window.addEventListener('hashchange', () => {
        const hash = window.location.hash.substring(1);
        if (hash && screens[hash]) {
          showScreen(hash);
        }
      });
      
      // Show initial screen based on hash or default to today
      const initialHash = window.location.hash.substring(1);
      if (initialHash && screens[initialHash]) {
        showScreen(initialHash);
      } else {
        showScreen('today');
      }
      
      // Setup theme toggle listeners for You screen
      const youScreen = document.getElementById('screen-you');
      if (youScreen) {
        const themeToggle = youScreen.querySelector('.settings-toggle');
        if (themeToggle) {
          themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            applyTheme(newTheme);
            
            // Update toggle visual
            const toggleDot = themeToggle.querySelector('div');
            toggleDot.style.transform = isDark ? 'translateX(0)' : 'translateX(14px)';
          });
        }
      }
    }
    
    // Start preview when DOM loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPreview);
    } else {
      initPreview();
    }
