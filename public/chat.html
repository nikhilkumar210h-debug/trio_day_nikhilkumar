<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081018">
<title>Chat — Trio Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>:root{--primary:#6366f1;--bg:#0a0f1a;--surface:#141b2e;--ink:#f1f5f9;--border:rgba(148,163,184,.12)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200}.tricolor-strip span{flex:1}.tricolor-strip span:nth-child(1){background:linear-gradient(90deg,#ff9933,#ff7700)}.tricolor-strip span:nth-child(2){background:#fff}.tricolor-strip span:nth-child(3){background:linear-gradient(90deg,#128807,#0a6305)}.topbar{position:sticky;top:3px;z-index:100;background:rgba(17,24,39,.9);border-bottom:1px solid var(--border)}.chat-main{width:min(1200px,100%);margin:auto;padding:20px 20px 0}.inbox-panel{background:var(--surface);border:1px solid var(--border);border-radius:24px;min-height:calc(100vh - 280px)}</style>
<link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="style.css"></noscript>
<link rel="preload" href="chat.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="chat.css"></noscript>
<link rel="manifest" href="manifest.json">
</head>
<body class="chat-page">
<div class="tricolor-strip"><span></span><span></span><span></span></div>
<header class="topbar chat-topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>CHAT</small></span></a>
    <div class="chat-top-user">
      <div class="chat-user-pill"><span id="chatPillAvatar" class="chat-pill-avatar">N</span><span id="chatPillName" class="chat-pill-name">Loading...</span></div>
      <div class="chat-top-icons"><button class="icon-link" type="button" aria-label="Notifications">◌</button><button id="chatMenuBtn" class="icon-link" type="button" aria-label="Chat menu">⋮</button></div>
    </div>
  </div>
</header>

<main class="chat-main">
  <div class="chat-header-row">
    <div><div class="eyebrow small-eyebrow">MESSAGES</div><h1>Chat</h1></div>
    <div class="chat-mode-switch" role="tablist" aria-label="Chat mode">
      <button class="chat-mode-btn active" type="button" data-mode="private">Private</button>
      <button class="chat-mode-btn" type="button" data-mode="group">Group</button>
    </div>
  </div>

  <section id="privateInbox" class="inbox-panel">
    <div class="inbox-head">
      <div><strong>Messages</strong><span>Your private conversations</span></div>
      <div class="inbox-count" id="conversationCount">0</div>
    </div>
    <div class="inbox-tools"><input id="userSearch" class="chat-search" type="search" placeholder="Search conversations or user ID"></div>
    <div id="userList" class="chat-user-list inbox-list"></div>
  </section>

  <section id="groupPanel" class="chat-panel" hidden>
    <div class="chat-panel-head"><div><strong>Community group</strong><span>Everyone can join</span></div></div>
    <div id="groupMessages" class="messages"></div>
    <form id="groupForm" class="chat-input-row"><input id="groupInput" maxlength="500" autocomplete="off" placeholder="Message the group…"><button class="btn primary" type="submit">Send</button></form>
  </section>
</main>

<nav class="bottom-nav"><div class="nav-row"><a class="nav-btn" href="index.html"><span class="nav-icon">⌂</span><span>Posts</span></a><a class="nav-btn" href="all-users.html"><span class="nav-icon">👥</span><span>Users</span></a><a class="nav-btn" href="tasks.html"><span class="nav-icon">⚡</span><span>Tasks</span></a><a class="nav-btn active" href="chat.html"><span class="nav-icon">✉</span><span>Chat</span></a><a class="nav-btn" href="profile.html"><span class="nav-icon">◉</span><span>Profile</span></a></div></nav>
<script type="module" src="auth-guard.js"></script>
<script type="module" src="chat.js"></script>
<script type="module" src="auth-ui.js"></script>
</body>
</html>
