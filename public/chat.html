  <title>Chat — Trio Day</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="styles/nav.css?v=20261018">

<body class="chat-page">
<div class="tricolor-strip"><span></span><span></span><span></span></div>
<header class="topbar chat-topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>CHAT</small></span></a>
    <div id="authStatus" class="auth-status"></div>
  </div>
</header>

<main class="chat-main nkm-chat">
  <div class="nkm-chat-head">
    <h1>Messages</h1>
    <p>Recent conversations · <a href="index.html" style="color:var(--color-primary-text);text-decoration:none;font-weight:800">Start an Activity →</a></p>
  </div>
  <section id="activityContext" hidden style="margin:0 0 14px;padding:14px;border:1px solid var(--color-border);border-radius:16px;background:var(--color-surface)">
    <strong id="activityContextTitle">Activity conversation</strong>
    <p id="activityContextText" style="font-size:12px;color:var(--color-ink-muted);margin:5px 0 10px"></p>
    <a id="activityContextLink" class="nkm-btn nkm-btn--primary nkm-btn--sm" href="activity-player.html">View activity →</a>
  </section>
  <section class="td3-chat-spark" aria-label="Start from a shared activity">
    <div class="td3-chat-spark-icon">⚡</div>
    <div>
      <span>TURN A MOMENT INTO A CHAT</span>
      <strong>Completed the same activity?</strong>
      <p>Open the activity, compare your reflections, then talk about it.</p>
    </div>
    <a href="index.html">Browse Activities →</a>
  </section>
  <section id="privateInbox" class="nkm-inbox-panel" aria-label="Private messages">
    <div class="nkm-inbox-head">
      <strong>Messages</strong><span id="conversationCount" class="nkm-badge">0</span>
    </div>
    <div class="nkm-inbox-search"><input id="userSearch" class="nkm-search" type="search" placeholder="Search conversations…"></div>
    <div id="userList" class="nkm-inbox-list"><div class="td-skeleton td-skeleton--card"></div><div class="td-skeleton td-skeleton--card"></div><div class="td-skeleton td-skeleton--card"></div></div>
  </section>
</main>

<nav class="bottom-nav" aria-label="Primary navigation">

</nav>

<script type="module" src="ui/nav.js?v=20260922-nav7"></script>
<script type="module" src="ui/sound.js?v=20261018"></script>
<script type="module" src="ui/sheet.js?v=20261018"></script>
</body>
</html>
