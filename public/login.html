<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1017">
  <meta name="description" content="Login to Trio Day — post, comment, and chat.">
  <title>Login — Trio Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <style>:root{--primary:#6366f1;--primary-strong:#4f46e5;--bg:#0a0f1a;--surface:#141b2e;--surface-strong:#1e293b;--ink:#f1f5f9;--ink-muted:#94a3b8;--border:rgba(148,163,184,.12);--r-md:14px;--r-lg:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body.auth-body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px 16px 40px}.tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200;width:100%}.tricolor-strip span{flex:1}.tricolor-strip span:nth-child(1){background:linear-gradient(90deg,#ff9933,#ff7700)}.tricolor-strip span:nth-child(2){background:#fff}.tricolor-strip span:nth-child(3){background:linear-gradient(90deg,#128807,#0a6305)}.auth-wrap{width:min(420px,100%);margin-top:48px;display:flex;flex-direction:column;gap:20px}.auth-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand-chakra{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:rgba(99,102,241,.12);color:#6366f1;border:1px solid var(--border)}.brand-copy strong{font-family:'Baloo 2',sans-serif;font-size:1.25rem}.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.3);width:100%}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-weight:600;background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-strong));border:0;color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.35);width:100%}.google-btn{width:100%;background:#fff;color:#111;border:0}.field{display:block;margin-top:16px}.label-text{display:block;font-size:.7rem;color:var(--ink-muted);margin-bottom:6px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}.field input{width:100%;border:1px solid var(--border);background:rgba(255,255,255,.04);border-radius:12px;color:var(--ink);padding:12px;outline:0}.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--ink-muted);font-size:.8rem}.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}.link-btn{border:0;background:none;color:var(--ink-muted);font-size:.85rem;margin:12px auto 0;display:block;cursor:pointer}</style>
  <link rel="preload" href="styles/tokens.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="styles/tokens.css"></noscript>
  <link rel="preload" href="styles/skeleton.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/skeleton.css"></noscript>
  <link rel="preload" href="styles/sheet.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/sheet.css"></noscript>
  <link rel="preload" href="styles/nav.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/nav.css"></noscript>
  <link rel="preload" href="styles/header.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/header.css"></noscript>
  <link rel="preload" href="styles/components.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="styles/components.css"></noscript>

  <noscript><link rel="stylesheet" href="style.css?v=32da237f"></noscript>

    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='10.7' fill='%23FF9933'/%3E%3Crect y='10.7' width='32' height='10.7' fill='%23fff'/%3E%3Crect y='21.4' width='32' height='10.6' fill='%23138808'/%3E%3Ccircle cx='16' cy='16' r='4.1' fill='none' stroke='%230A1172' stroke-width='1.1'/%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
</head>

<body class="auth-body">
  <div class="tricolor-strip" aria-hidden="true"><span></span><span></span><span></span></div>

  <main id="main-content" class="auth-wrap">
    <a class="brand auth-brand" href="index.html" aria-label="Trio Day home">
      <span class="brand-chakra" aria-hidden="true">☸</span>
      <span class="brand-copy"><strong>trio_day</strong><small>15 AUG • INDIA</small></span>
    </a>

    <div class="auth-card">
      <h1>Welcome</h1>
      <p class="auth-sub">Login to post, comment, aur chat karo.</p>

      <button id="googleBtn" type="button" class="btn google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4"
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.87 2.69-6.64z" />
          <path fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.9v2.33C2.38 15.98 5.48 18 9 18z" />
          <path fill="#FBBC05"
            d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.7V4.97H.9A9 9 0 000 9c0 1.45.35 2.83.9 4.03l3.05-2.33z" />
          <path fill="#EA4335"
            d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.38 2.02.9 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z" />
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider"><span>or</span></div>

      <form id="emailForm" novalidate>
        <label class="field" id="nameField" hidden><span class="label-text">Full name</span><input type="text"
            id="fullName" placeholder="e.g. Asha Patel" maxlength="50" autocomplete="name"></label>
        <label class="field"><span class="label-text">Email</span><input type="email" id="email"
            placeholder="you@example.com" required autocomplete="email"></label>
        <label class="field"><span class="label-text">Password</span><input type="password" id="password"
            placeholder="At least 6 characters" required autocomplete="current-password"></label>
        <p id="authFormStatus" class="status" aria-live="polite"></p>
        <button type="submit" id="emailSubmitBtn" class="btn primary full">Login</button>
      </form>
      <button id="modeToggle" type="button" class="link-btn">New here? Create account</button>
    </div>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module" src="ui/header.js"></script>
  <script type="module" src="ui/nav.js"></script>
  <script type="module" src="ui/sheet.js"></script>
</body>

</html>
