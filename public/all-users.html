    <script>!function(){try{var k='trio-theme',t=localStorage.getItem(k);if(t!=='light'&&t!=='dark'){t=localStorage.getItem('trio_theme');t=(t==='light'||t==='dark')?t:null;}if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#f8fafc':'#0a0f1a');}catch(e){}}</script>
    <title>Discover Challenges — Trio Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    <style>
.discover-card{overflow:hidden;background:var(--color-surface);border:1px solid var(--color-border);border-radius:18px}.challenge-art{height:145px;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle at 30% 20%,rgba(99,102,241,.24),transparent 55%),#111827}.challenge-body{padding:14px}.challenge-title{font-size:16px;font-weight:800;margin:0 0 6px}.challenge-objective{font-size:12px;color:var(--color-ink-muted);line-height:1.45;min-height:34px}.challenge-meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill{font-size:10px;padding:5px 8px;border-radius:999px;background:rgba(148,163,184,.09);color:var(--color-ink-muted)}.challenge-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;color:var(--color-ink-muted);font-size:10px}.challenge-stats strong{display:block;color:var(--color-ink);font-size:12px}.accept-btn{width:100%;height:40px;border:0;border-radius:12px;background:#f1f5f9;color:#0a0f1a;font-weight:800}.discover-empty{padding:30px;text-align:center;color:var(--color-ink-muted);border:1px dashed var(--color-border);border-radius:16px}@media(max-width:680px){#challengeGrid{grid-template-columns:1fr!important}.challenge-art{height:125px}}
</style>  <link rel="stylesheet" href="styles/tokens.css">  <link rel="stylesheet" href="styles/skeleton.css">  <link rel="stylesheet" href="styles/sheet.css">  <link rel="stylesheet" href="styles/nav.css">  <link rel="stylesheet" href="styles/header.css">  <link rel="stylesheet" href="styles/components.css">  <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="tricolor-strip"><span></span><span></span><span></span></div>
    <header class="topbar">
        <div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-chakra">☸</span><span
                    class="brand-copy"><strong>trio_day</strong><small>ALL USERS</small></span></a>
            <div id="authStatus" class="auth-status"></div>
        </div>
    </header>
    <main class="users-main nkm-people" style="max-width:980px">
<div class="nkm-people-head"><h1>Discover challenges</h1><p>Find something worth solving. Accept now, start when you're ready.</p></div>
<div class="nkm-people-search"><input id="usersSearch" class="nkm-search" type="search" placeholder="Search challenges…"></div>
<div id="challengeFilters" style="display:flex;gap:8px;overflow:auto;padding:4px 0 10px">
<select id="categoryFilter" class="nkm-search" style="height:36px"><option value="">Category</option><option>Logic</option><option>Observation</option><option>Speed</option><option>Reasoning</option><option>Memory</option><option>Decision</option><option>Knowledge</option></select>
<select id="difficultyFilter" class="nkm-search" style="height:36px"><option value="">Difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
<select id="timeFilter" class="nkm-search" style="height:36px"><option value="">Time</option><option value="5">≤ 5 min</option><option value="15">≤ 15 min</option><option value="30">≤ 30 min</option><option value="60">≤ 60 min</option></select>
<select id="ratingFilter" class="nkm-search" style="height:36px"><option value="">Rating</option><option value="4">4+ ★</option><option value="3">3+ ★</option></select>
<select id="sortFilter" class="nkm-search" style="height:36px"><option value="active">Active</option><option value="rating">Top rated</option><option value="new">New</option><option value="ending">Ending soon</option></select>
</div>
<div id="peopleStatus"></div><div id="challengeGrid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px"></div>
</main>
