<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f12">
<title>Discover — Trio Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<script>!function(){try{var t=localStorage.getItem('trio-theme')||localStorage.getItem('trio_theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}}()</script>
<link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles/skeleton.css"><link rel="stylesheet" href="styles/sheet.css"><link rel="stylesheet" href="styles/nav.css"><link rel="stylesheet" href="styles/header.css"><link rel="stylesheet" href="styles/components.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="styles/discover.css?v=2"><link rel="manifest" href="manifest.json">
</head>
<body class="discover-page">
<div class="tricolor-strip"><span></span><span></span><span></span></div>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-chakra">☸</span><span class="brand-copy"><strong>trio_day</strong><small>DISCOVER</small></span></a><div id="authStatus" class="auth-status"></div></div></header>
<main class="discover-main">
<section class="discover-hero">
  <div class="discover-hero-copy">
    <span class="discover-kicker">Challenge marketplace</span>
    <h1 class="discover-title">Find something worth solving.</h1>
    <p class="discover-subtitle">Browse community-made challenges, pick your difficulty, and start when you are ready. Quality challenges rise through ratings and real activity—not noise.</p>
  </div>
  <div class="discover-stats" aria-label="Discover overview">
    <div class="discover-stat"><strong id="discoverCount">—</strong><span>Live</span></div>
    <div class="discover-stat"><strong id="discoverMysteryCount">—</strong><span>Mystery</span></div>
    <div class="discover-stat"><strong id="discoverJoinedCount">—</strong><span>Accepted</span></div>
  </div>
</section>
<section class="discover-toolbar" aria-label="Challenge filters">
  <div class="discover-search-row">
    <input id="usersSearch" class="nkm-search" type="search" placeholder="Search title, idea, creator…" autocomplete="off">
    <select id="sortFilter" aria-label="Sort">
      <option value="active">Active</option><option value="rating">Top rated</option><option value="new">New</option><option value="ending">Ending soon</option>
    </select>
  </div>
  <div class="discover-filter-row">
    <select id="categoryFilter" aria-label="Category"><option value="">Category</option><option>Logic</option><option>Observation</option><option>Speed</option><option>Reasoning</option><option>Memory</option><option>Decision</option><option>Knowledge</option></select>
    <select id="difficultyFilter" aria-label="Difficulty"><option value="">Difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select>
    <select id="timeFilter" aria-label="Time"><option value="">Time</option><option value="5">≤ 5 min</option><option value="15">≤ 15 min</option><option value="30">≤ 30 min</option><option value="60">≤ 60 min</option></select>
    <select id="ratingFilter" aria-label="Rating"><option value="">Rating</option><option value="4">4+ ★</option><option value="3">3+ ★</option></select>
  </div>
</section>
<div class="discover-resultline"><span id="peopleStatus">Loading challenges…</span><strong id="discoverResultCount"></strong></div>
<div id="challengeGrid" class="challenge-grid" aria-live="polite"></div>
</main>
<nav class="bottom-nav" aria-label="Primary navigation"><div class="nav-row"></div></nav>
<script type="module" src="auth-guard.js"></script><script type="module" src="all-users.js?v=35"></script><script type="module" src="auth-ui.js"></script><script type="module" src="theme.js"></script><script type="module" src="ui/header.js"></script><script type="module" src="ui/nav.js?v=2"></script><script type="module" src="ui/sheet.js"></script>
</body></html>
