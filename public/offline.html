<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081018">
  <script>!function(){try{var k='trio-theme',t=localStorage.getItem(k);if(t!=='light'&&t!=='dark'){t=localStorage.getItem('trio_theme');t=(t==='light'||t==='dark')?t:null;}if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#f8fafc':'#0a0f1a');}catch(e){}}</script>
  <title>Offline — Trio Day</title>
  <style>
    :root{--primary:#6366f1;--bg:#0a0f1a;--surface:#141b2e;--ink:#f1f5f9;--ink-muted:#94a3b8;--border:rgba(148,163,184,.12);--r-lg:18px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
    .tricolor-strip{height:3px;display:flex;position:fixed;inset:0 0 auto;z-index:200;width:100%}
    .tricolor-strip span{flex:1}
    .tricolor-strip span:nth-child(1){background:linear-gradient(90deg,#ff9933,#ff7700)}
    .tricolor-strip span:nth-child(2){background:#fff}
    .tricolor-strip span:nth-child(3){background:linear-gradient(90deg,#128807,#0a6305)}
    .wrap{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:16px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;margin-bottom:8px}
    .brand-chakra{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:rgba(99,102,241,.12);color:#6366f1;border:1px solid var(--border);font-size:24px}
    .brand-copy strong{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:1.5rem;font-weight:800}
    .card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 24px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
    .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);font-weight:700;margin-bottom:8px}
    h1{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:clamp(24px,6vw,32px);margin:0 0 12px;font-weight:800}
    p{color:var(--ink-muted);line-height:1.6;margin:0 0 24px;font-size:15px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 28px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,var(--primary),#4f46e5);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.35);border:0;cursor:pointer;font-size:15px}
    .btn:active{transform:scale(.98)}
    [data-theme="light"]{--bg:#f8fafc;--surface:#ffffff;--ink:#0f172a;--ink-muted:#475569;--border:rgba(15,23,42,.08);--primary:#4f46e5}
    [data-theme="light"] .card{box-shadow:0 8px 24px rgba(15,23,42,.10)}
  </style>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="tricolor-strip" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="wrap">
    <a class="brand" href="/" aria-label="Trio Day home">
      <span class="brand-chakra" aria-hidden="true">☸</span>
      <span class="brand-copy"><strong>trio_day</strong></span>
    </a>
    <div class="card">
      <span class="eyebrow">You're offline</span>
      <h1>No connection</h1>
      <p>Trio Day needs an internet connection to load posts, chats, and notifications. Your content will be here when you're back online.</p>
      <a class="btn" href="/">Try again</a>
    </div>
  </main>
  <script type="module" src="theme.js"></script>
</body>
</html>
